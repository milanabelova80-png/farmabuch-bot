<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FarmaBuch Quizlet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
    }
    .header {
      width: 100%;
      max-width: 420px;
      text-align: center;
      margin-bottom: 8px;
    }
    .header h2 {
      font-size: 20px;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    select, .search-input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      font-size: 14px;
      outline: none;
      margin-bottom: 8px;
    }
    .search-input::placeholder {
      color: #64748b;
    }
    .progress-bar {
      width: 100%;
      max-width: 420px;
      height: 6px;
      background: #1e293b;
      border-radius: 4px;
      margin: 6px 0 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      width: 0%;
      transition: width 0.3s ease;
    }
    .counter {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .scene {
      width: 100%;
      max-width: 420px;
      height: 310px;
      perspective: 1000px;
      cursor: pointer;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .card.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      user-select: none;
      overflow-y: auto;
    }
    .card-front {
      background: #1e293b;
      border: 2px solid #334155;
    }
    .card-back {
      background: #0369a1;
      border: 2px solid #38bdf8;
      transform: rotateY(180deg);
      justify-content: flex-start;
      text-align: left;
    }
    .badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
      color: #e2e8f0;
      margin-bottom: 12px;
      align-self: center;
      flex-shrink: 0;
    }
    .card-text {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.35;
    }
    .card-back .card-text {
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.45;
      width: 100%;
    }
    .card-back .card-text b {
      color: #bae6fd;
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      width: 100%;
      max-width: 420px;
    }
    button {
      flex: 1;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.7; }
    .btn-prev { background: #334155; }
    .btn-shuffle { background: #475569; flex: 0.6; }
    .btn-next { background: #0284c7; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🃏 FarmaBuch Quizlet</h2>
    <select id="moduleSelect" onchange="changeModule()">
      <option value="all">📚 Все модули (Полный курс — 178)</option>
      <option value="1">📜 Модуль 1. Общая рецептура (10)</option>
      <option value="2">🧬 Модуль 2. Общая фармакология (10)</option>
      <option value="3" selected>🌿 Модуль 3. Холинотропные средства (21)</option>
      <option value="4">⚡ Модуль 4. Адреномиметики (10)</option>
      <option value="5">🛡️ Модуль 5. Адреноблокаторы. Симпатолитики (10)</option>
      <option value="6">🌙 Модуль 6. Снотворные, эпилепсия, паркинсонизм (12)</option>
      <option value="7">🧠 Модуль 7. Психотропные средства (11)</option>
      <option value="8">💉 Модуль 8. Анальгетики и анестетики (11)</option>
      <option value="9">🔥 Модуль 9. НПВП, гормоны, аллергия (11)</option>
      <option value="10">🫁 Модуль 10. Органы дыхания и ЖКТ (11)</option>
      <option value="11">❤️ Модуль 11. Сердечно-сосудистые ЛС (12)</option>
      <option value="12">💧 Модуль 12. Диуретические средства (8)</option>
      <option value="13">🩸 Модуль 13. Средства, влияющие на гемостаз (10)</option>
      <option value="14">🦠 Модуль 14. Антибиотики — I (10)</option>
      <option value="15">💊 Модуль 15. Антибиотики — II (11)</option>
      <option value="16">🔬 Модуль 16. Противовирусные и противоопухолевые (10)</option>
    </select>
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Быстрый поиск препарата по всем карточкам..." oninput="searchCards()">
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="counter" id="counter">Карточка 1</div>

  <div class="scene" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="badge" id="frontBadge">Препарат / Понятие</div>
        <div class="card-text" id="frontText">Загрузка...</div>
      </div>
      <div class="card-face card-back">
        <div class="badge">Группа • Доза • Применение</div>
        <div class="card-text" id="backText">...</div>
      </div>
    </div>
  </div>

  <div class="hint">👆 Нажми на карточку, чтобы перевернуть</div>

  <div class="controls">
    <button class="btn-prev" onclick="prevCard()">⬅️ Назад</button>
    <button class="btn-shuffle" onclick="shuffleCards()">🔀</button>
    <button class="btn-next" onclick="nextCard()">Дальше ➡️</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const allCards = [
      // ================= МОДУЛЬ 1: ОБЩАЯ РЕЦЕПТУРА (10) =================
      { mod: "1", front: "Inscriptio (Заголовок рецепта)", back: "<b>Суть:</b> Вводная часть рецептурного бланка.<br><b>Содержит:</b> Штамп медицинской организации, дату выписки, ФИО и возраст пациента, ФИО врача." },
      { mod: "1", front: "Praescriptio (Пропись / Обращение)", back: "<b>Суть:</b> Основная часть рецепта, начинающаяся со слова «Recipe:» (Rp.: — Возьми).<br><b>Содержит:</b> Наименования лекарственных веществ на латинском языке в родительном падеже и их количество." },
      { mod: "1", front: "Subscriptio (Подпись врача к фармацевту)", back: "<b>Суть:</b> Указание фармацевту о лекарственной форме и числе доз.<br><b>Примеры:</b> Misce, ut fiat unguentum (Смешай, чтобы получилась мазь); Da tales doses numero 10 (Выдай таких доз числом 10)." },
      { mod: "1", front: "Signatura (Сигнатура)", back: "<b>Суть:</b> Часть рецепта, начинающаяся с «Signa:» (S.: — Обозначь).<br><b>Правило:</b> Пишется на русском или национальном языке пациента (способ приема, доза, кратность, время приема относительно еды)." },
      { mod: "1", front: "Бланк формы № 107-1/у", back: "<b>Назначение:</b> Стандартный рецептурный бланк для выписывания большинства рецептурных препаратов.<br><b>Срок действия:</b> 60 дней (при хронических заболеваниях — до 1 года)." },
      { mod: "1", front: "Бланк формы № 148-1/у-88", back: "<b>Назначение:</b> Строгой учетности: психотропные вещества Списка III, сильнодействующие и ядовитые средства, анаболические стероиды, кодеинсодержащие и ПКУ.<br><b>Срок действия:</b> 15 дней." },
      { mod: "1", front: "Бланк формы № 107/у-НП", back: "<b>Назначение:</b> Специальный розовый бланк для наркотических средств и психотропных веществ Списка II (морфин, фентанил, промедол).<br><b>Срок действия:</b> 15 дней." },
      { mod: "1", front: "Паста (Pasta)", back: "<b>Группа:</b> Мягкая лекарственная форма.<br><b>Состав:</b> Густая мазь, содержащая от 25% до 65% порошкообразных веществ.<br><b>Применение:</b> Местно как вяжущее, подсушивающее, адсорбирующее и защитное средство." },
      { mod: "1", front: "Суппозитории (Suppositoria)", back: "<b>Группа:</b> Дозированная мягкая лекарственная форма.<br><b>Особенность:</b> Твердые при комнатной температуре и расплавляющиеся при температуре тела (ректальные — 1–4 г, вагинальные — 1,5–6 г). Основа — масло какао (Oleum Cacao)." },
      { mod: "1", front: "Галеновые и Новогаленовые препараты", back: "<b>Галеновые:</b> Настойки (Tincturae) и экстракты (Extracta) из растительного сырья, содержащие балластные вещества (только внутрь/наружно).<br><b>Новогаленовые:</b> Максимально очищенные от балласта вытяжки (можно вводить парентерально)." },

      // ================= МОДУЛЬ 2: ОБЩАЯ ФАРМАКОЛОГИЯ (10) =================
      { mod: "2", front: "Биодоступность (F)", back: "<b>Определение:</b> Часть введенной дозы неизмененного лекарственного вещества, достигшая системного кровотока.<br><b>Особенности:</b> При внутривенном введении равна 100%. При приеме внутрь снижается из-за неполного всасывания и пресистемного метаболизма." },
      { mod: "2", front: "Эффект первого прохождения (Пресистемный метаболизм)", back: "<b>Суть:</b> Разрушение лекарственного вещества ферментами печени (CYP450) после всасывания из ЖКТ через систему воротной вены до попадания в общий кровоток.<br><b>Как обойти:</b> Сублингвальный, ректальный, парентеральный или ингаляционный путь." },
      { mod: "2", front: "Период полувыведения (T1/2)", back: "<b>Определение:</b> Время, за которое концентрация лекарственного средства в плазме крови снижается ровно на 50%.<br><b>Значение:</b> Позволяет рассчитать интервал между приемами препарата и время полного выведения (около 5 периодов T1/2)." },
      { mod: "2", front: "Кумуляция", back: "<b>Материальная:</b> Накопление самого лекарственного вещества при медленном выведении (дигоксин, фенобарбитал).<br><b>Функциональная:</b> Накопление фармакологического эффекта при отсутствии самого вещества в крови (этанол — белая горячка, ингибиторы МАО)." },
      { mod: "2", front: "Тахифилаксия", back: "<b>Определение:</b> Очень быстрое снижение эффективности препарата при повторном введении через короткие промежутки времени (от нескольких минут до часов).<br><b>Примеры:</b> Эфедрин, нафазолин (нафтизин) — из-за истощения запасов медиатора." },
      { mod: "2", front: "Толерантность (Привыкание)", back: "<b>Определение:</b> Постепенное ослабление эффекта препарата при длительном применении, требующее повышения дозы.<br><b>Механизмы:</b> Ускорение метаболизма в печени (индукция CYP450) или снижение чувствительности рецепторов (десенситизация)." },
      { mod: "2", front: "Идиосинкразия", back: "<b>Определение:</b> Врожденная, генетически обусловленная атипичная реакция на первое же введение препарата, связанная с дефицитом ферментов (энзимопатией).<br><b>Пример:</b> Длительное апноэ от суксаметония при дефиците псевдохолинэстеразы." },
      { mod: "2", front: "Терапевтический индекс (Широта)", back: "<b>Формула:</b> Отношение летальной/токсической дозы к эффективной (LD50 / ED50) или диапазон от минимальной терапевтической до минимальной токсической дозы.<br><b>Значение:</b> Чем выше индекс, тем безопаснее препарат (низкий — у дигоксина, лития, варфарина)." },
      { mod: "2", front: "Агонисты и Антагонисты", back: "<b>Агонист (миметик):</b> Обладает и сродством к рецептору (аффинитетом), и внутренней активностью (вызывает отклик).<br><b>Антагонист (блокатор):</b> Обладает аффинитетом, но лишен внутренней активности — связывается с рецептором и экранирует его." },
      { mod: "2", front: "Синергизм (Суммация и Потенцирование)", back: "<b>Суммация (аддитивный эффект):</b> Общий эффект равен арифметической сумме эффектов компонентов (1 + 1 = 2).<br><b>Потенцирование:</b> Один препарат многократно усиливает действие другого, общий эффект превышает сумму (1 + 1 = 5, например, нейролептик + наркозное)." },

      // ================= МОДУЛЬ 3: ХОЛИНОТРОПНЫЕ СРЕДСТВА (21) =================
      { mod: "3", front: "Карбахол", back: "<b>Группа:</b> M,N-холиномиметик.<br><b>Доза:</b> 0,05% - 0,5 мл.<br><b>Применение:</b> в виде глазных капель при глаукоме (раствор для внутриглазного введения)." },
      { mod: "3", front: "Пилокарпин", back: "<b>Группа:</b> М-холиномиметик.<br><b>Доза:</b> 1–5% - 10 мл.<br><b>Применение:</b> местно в виде глазных капель для курсового лечения глаукомы или для купирования глаукоматозного криза. Только местно, так как является довольно токсичным." },
      { mod: "3", front: "Цитизин", back: "<b>Группа:</b> N-холиномиметик.<br><b>Доза:</b> Т 1,5 мг.<br><b>Применение:</b> Стимулирует N-холинорецепторы каротидных клубочков и рефлекторно возбуждает дыхательный центр. Уменьшает симптомы отмены. Входит в состав препарата Табекс, облегчающего отвыкание от курения табака." },
      { mod: "3", front: "Варениклин", back: "<b>Группа:</b> N-холиномиметик.<br><b>Доза:</b> Т 0,0005.<br><b>Применение:</b> Никотиновая зависимость у взрослых." },
      { mod: "3", front: "Галантамин", back: "<b>Группа:</b> Антихолинэстеразный (обратимый).<br><b>Доза:</b> А 0,1 - 0,5 - 1% - 1 мл; Т 0,004; 0,008; 0,012.<br><b>Применение:</b> миастения, парезы и параличи скелетной мускулатуры, послеоперационная атония кишечника и мочевого пузыря, устранение эффектов миорелаксантов.<br><b>Особые показания:</b> деменция альцгеймеровского типа." },
      { mod: "3", front: "Неостигмин", back: "<b>Группа:</b> Антихолинэстеразный (обратимый).<br><b>Доза:</b> Т 0,015; А 0,05% - 1 мл.<br><b>Применение:</b> миастения, парезы и параличи скелетной мускулатуры, послеоперационная атония кишечника и мочевого пузыря, устранение эффектов миорелаксантов." },
      { mod: "3", front: "Ривастигмин", back: "<b>Группа:</b> Антихолинэстеразный (обратимый).<br><b>Доза:</b> К 9 и 18 мг.<br><b>Применение:</b> оказывает положительное влияние на нарушения когнитивных процессов, характерных для болезни Альцгеймера или деменции при болезни Паркинсона." },
      { mod: "3", front: "Армин", back: "<b>Группа:</b> Антихолинэстеразный (необратимый).<br><b>Доза:</b> глазные капли 0,01%.<br><b>Применение:</b> Возможно только местное применение при тяжелой глаукоме." },
      { mod: "3", front: "Атропин", back: "<b>Группа:</b> М-холиноблокатор (неизбирательный).<br><b>Доза:</b> 0,5–1% 10 мл; Т 0,0005; А 0,1% - 1 мл.<br><b>Применение:</b> брадикардия и блокада сердца, спазмы кишечника и мочевых путей, повышенная потливость, для премедикации перед наркозом (подавляет секрецию слюнных и бронхиальных желез), при отравлении М-холиномиметиками и антихолинэстеразными средствами, в глазной практике для расширения зрачка и при острых воспалительных заболеваниях и травмах глаз." },
      { mod: "3", front: "Платифиллин", back: "<b>Группа:</b> М-холиноблокатор (неизбирательный).<br><b>Доза:</b> Т 0,005; А 0,2% - 1 мл.<br><b>Применение:</b> главным образом при спазмах желудка, кишечника, желчных путей, мочеточников." },
      { mod: "3", front: "Тропикамид", back: "<b>Группа:</b> М-холиноблокатор (неизбирательный).<br><b>Доза:</b> 0,5–1%.<br><b>Применение:</b> при необходимости мидриаза при исследовании глазного дна и оценки состояния хрусталика; при необходимости паралича аккомодации при исследовании рефракции; хирургия хрусталика; лазеротерапия сетчатки; хирургия сетчатки и стекловидного тела." },
      { mod: "3", front: "Ипратропия бромид", back: "<b>Группа:</b> М-холиноблокатор (неизбирательный).<br><b>Доза:</b> дозированный аэрозоль 0,00002.<br><b>Применение:</b> ХОБЛ, БА, бронхоспазм на фоне простудных заболеваний; для подготовки дыхательных путей перед введением в аэрозолях антибиотиков, глюкокортикоидов и других ЛВ. Не рекомендуется для экстренного купирования приступа удушья." },
      { mod: "3", front: "Пирензепин", back: "<b>Группа:</b> М-холиноблокатор (избирательный М1).<br><b>Доза:</b> Т 0,025 и 0,05; А 0,5% - 2 мл.<br><b>Применение:</b> ЯБЖ и двенадцатиперстной кишки (лечение и профилактика); рефлюкс-эзофагит; эрозивно-язвенные поражения ЖКТ (лекарственные, стрессовые язвы)." },
      { mod: "3", front: "Толтеродин", back: "<b>Группа:</b> М-холиноблокатор (избирательный М2, М3).<br><b>Доза:</b> К 0,002 и 0,004.<br><b>Применение:</b> при гиперактивности мочевого пузыря (частые позывы или недержание). Эффект развивается через 4 недели применения." },
      { mod: "3", front: "Гексаметоний", back: "<b>Группа:</b> Ганглиоблокатор.<br><b>Доза:</b> А 2,5% - 1,0.<br><b>Применение:</b> Спазмы периферических сосудов, купирование гипертонического криза, язвенная болезнь желудка и двенадцатиперстной кишки, бронхоспазм, для управляемой гипотензии." },
      { mod: "3", front: "Азаметония бромид", back: "<b>Группа:</b> Ганглиоблокатор.<br><b>Доза:</b> А 5% - 1 мл.<br><b>Применение:</b> Заболевания со спазмами периферических сосудов (эндартериит, перемежающаяся хромота). В комбинированной терапии при гипертоническом кризе, отеке легких, отеке мозга. Для управляемой артериальной гипотензии, при цистоскопии у мужчин." },
      { mod: "3", front: "Триметафан", back: "<b>Группа:</b> Ганглиоблокатор короткого действия.<br><b>Доза:</b> А 0,25.<br><b>Применение:</b> Создание управляемой гипотонии в хирургии, купирование гипертонического криза, гемодинамического отека легких и мозга." },
      { mod: "3", front: "Атракурий", back: "<b>Группа:</b> Антидеполяризующий миорелаксант.<br><b>Доза:</b> 1% - 2,5 и 5 мл.<br><b>Применение:</b> Для миорелаксации при хирургических вмешательствах и диагностических процедурах (при наличии средств для проведения эндотрахеальной интубации и ИВЛ)." },
      { mod: "3", front: "Пипекуроний", back: "<b>Группа:</b> Антидеполяризующий миорелаксант.<br><b>Доза:</b> А 4 мг.<br><b>Применение:</b> Для расслабления скелетных мышц при проведении общей анестезии при хирургических вмешательствах и ИВЛ." },
      { mod: "3", front: "Векуроний", back: "<b>Группа:</b> Антидеполяризующий миорелаксант.<br><b>Доза:</b> А 4 мг.<br><b>Применение:</b> Для релаксации скелетных мышц во время хирургических операций." },
      { mod: "3", front: "Суксаметоний", back: "<b>Группа:</b> Деполяризующий миорелаксант.<br><b>Доза:</b> 2,5% - 5 мл и 10 мл.<br><b>Применение:</b> Вмешательства, требующие кратковременной миорелаксации: отключение спонтанного дыхания (интратрахеальная интубация, бронхоскопия); полная миорелаксация (эндоскопия, вправление вывихов, репозиция переломов, операции); профилактика судорог при ЭИТ; отравление стрихнином; столбняк." },

      // ================= МОДУЛЬ 4: АДРЕНОМИМЕТИКИ (10) =================
      { mod: "4", front: "Эпинефрин (Адреналин)", back: "<b>Группа:</b> α1, α2, β1, β2-адреномиметик прямого действия.<br><b>Доза:</b> А 0,1% - 1 мл.<br><b>Применение:</b> Анафилактический шок (препарат 1-й линии), асистолия и остановка сердца, купирование тяжелого приступа бронхиальной астмы, пролонгирование действия местных анестетиков, гипогликемическая кома." },
      { mod: "4", front: "Норэпинефрин (Норадреналин)", back: "<b>Группа:</b> α1, α2, β1-адреномиметик (слабое влияние на β2).<br><b>Доза:</b> А 0,2% - 1 мл (только в/в капельно!).<br><b>Применение:</b> Острое падение АД при шоковых состояниях, травмах, кровопотере и хирургических вмешательствах (при п/к и в/м введении вызывает некроз тканей!)." },
      { mod: "4", front: "Фенилэфрин (Мезатон)", back: "<b>Группа:</b> Селективный α1-адреномиметик.<br><b>Доза:</b> А 1% - 1 мл; капли 0,125% и 2,5%.<br><b>Применение:</b> Артериальная гипотензия, сосудистый коллапс, местно как деконгестант при ринитах и для расширения зрачка в офтальмологии." },
      { mod: "4", front: "Ксилометазолин / Нафазолин", back: "<b>Группа:</b> α1, α2-адреномиметики (антиконгестанты).<br><b>Доза:</b> Капли и спреи назальные 0,05% и 0,1% - 10 мл.<br><b>Применение:</b> Острый ринит, синусит, поллиноз, средний отит (для уменьшения отека слизистой носоглотки). При приеме > 5–7 дней вызывают тахифилаксию и медикаментозный ринит." },
      { mod: "4", front: "Клонидин (Клофелин)", back: "<b>Группа:</b> Центральный α2-адреномиметик (и агонист I1-имидазолиновых рецепторов).<br><b>Доза:</b> Т 0,000075 и 0,00015; А 0,01% - 1 мл.<br><b>Применение:</b> Купирование гипертонического криза, открытоугольная глаукома (местно). Опасен синдромом отмены!" },
      { mod: "4", front: "Изопреналин (Изадрин)", back: "<b>Группа:</b> Неселективный β1, β2-адреномиметик.<br><b>Доза:</b> Т 0,005; фл. 0,5% - 25 мл.<br><b>Применение:</b> АВ-блокада, выраженная брадикардия. При бронхиальной астме применяется редко из-за выраженной тахикардии и аритмогенности (стимуляция β1)." },
      { mod: "4", front: "Добутамин", back: "<b>Группа:</b> Селективный β1-адреномиметик.<br><b>Доза:</b> Флаконы 250 мг (в/в инфузионно).<br><b>Применение:</b> Кардиотоническое средство при острой сердечной недостаточности (острый инфаркт миокарда, кардиогенный шок)." },
      { mod: "4", front: "Сальбутамол / Фенотерол", back: "<b>Группа:</b> Селективные β2-адреномиметики короткого действия (SABA).<br><b>Доза:</b> Дозированный аэрозоль 100 мкг/доза.<br><b>Применение:</b> Экстренное купирование и профилактика приступов бронхоспазма при БА и ХОБЛ. Фенотерол (Партусистен) также используется как токолитик при угрозе преждевременных родов." },
      { mod: "4", front: "Сальметерол / Формотерол", back: "<b>Группа:</b> Селективные β2-адреномиметики длительного действия (LABA, до 12 часов).<br><b>Доза:</b> Аэрозоль / капсулы для ингаляций 25 мкг и 12 мкг.<br><b>Применение:</b> Базисная поддерживающая терапия бронхиальной астмы (в комбинации с ИГКС) и ХОБЛ." },
      { mod: "4", front: "Эфедрин", back: "<b>Группа:</b> Симпатомиметик (адреномиметик непрямого/смешанного действия).<br><b>Доза:</b> А 5% - 1 мл.<br><b>Применение:</b> Усиливает выброс норадреналина из везикул. Применяется при гипотензии при спинальной анестезии. Вызывает тахифилаксию и лекарственную зависимость." },

      // ================= МОДУЛЬ 5: АДРЕНОБЛОКАТОРЫ И СИМПАТОЛИТИКИ (10) =================
      { mod: "5", front: "Фентоламин", back: "<b>Группа:</b> Неселективный α1, α2-адреноблокатор.<br><b>Доза:</b> Т 0,025; А 0,5% - 1 мл.<br><b>Применение:</b> Феохромоцитома (купирование кризов), расстройства периферического кровообращения (болезнь Рейно, эндартериит). Побочный эффект — рефлекторная тахикардия." },
      { mod: "5", front: "Празозин / Доксазозин", back: "<b>Группа:</b> Селективные α1-адреноблокаторы.<br><b>Доза:</b> Т 0,001; 0,002 и 0,004.<br><b>Применение:</b> Артериальная гипертензия и доброкачественная гиперплазия предстательной железы (ДГПЖ). Возможен «эффект первой дозы» (ортостатический коллапс)." },
      { mod: "5", front: "Тамсулозин (Омник)", back: "<b>Группа:</b> Уроселективный α1A-адреноблокатор.<br><b>Доза:</b> К 0,0004 (400 мкг).<br><b>Применение:</b> Дизурические расстройства при доброкачественной гиперплазии предстательной железы (расслабляет гладкие мышцы простаты и шейки мочевого пузыря без падения АД)." },
      { mod: "5", front: "Пропранолол (Анаприлин)", back: "<b>Группа:</b> Неселективный β1, β2-адреноблокатор.<br><b>Доза:</b> Т 0,01 и 0,04; А 0,1% - 5 мл.<br><b>Применение:</b> АГ, стенокардия, тахиаритмии, тиреотоксикоз, эссенциальный тремор, мигрень. Противопоказан при бронхиальной астме (вызывает бронхоспазм), АВ-блокаде и брадикардии!" },
      { mod: "5", front: "Метопролол / Бисопролол", back: "<b>Группа:</b> Кардиоселективные β1-адреноблокаторы.<br><b>Доза:</b> Метопролол Т 0,05 и 0,1; Бисопролол Т 0,005 и 0,01.<br><b>Применение:</b> Артериальная гипертензия, ИБС (стенокардия, инфаркт миокарда), ХСН, тахиаритмии. Меньше риск бронхоспазма." },
      { mod: "5", front: "Атенолол", back: "<b>Группа:</b> Кардиоселективный гидрофильный β1-адреноблокатор.<br><b>Доза:</b> Т 0,05 и 0,1.<br><b>Применение:</b> АГ, стенокардия, наджелудочковые тахиаритмии. Не проникает через ГЭБ (не вызывает нарушений сна и депрессии)." },
      { mod: "5", front: "Небиволол (Небилет)", back: "<b>Группа:</b> Сверхселективный β1-адреноблокатор III поколения с вазодилатирующим эффектом.<br><b>Доза:</b> Т 0,005.<br><b>Применение:</b> АГ, ИБС, ХСН. Стимулирует выработку эндотелиального оксида азота (NO), расширяя сосуды." },
      { mod: "5", front: "Карведилол / Лабеталол", back: "<b>Группа:</b> Гибридные α1, β1, β2-адреноблокаторы.<br><b>Доза:</b> Карведилол Т 0,0125 и 0,025.<br><b>Применение:</b> Хроническая сердечная недостаточность (ХСН), артериальная гипертензия, стабильная стенокардия (обладает антиоксидантным и вазодилатирующим действием)." },
      { mod: "5", front: "Тимолол", back: "<b>Группа:</b> Неселективный β1, β2-адреноблокатор.<br><b>Доза:</b> Глазные капли 0,25% и 0,5% - 5 мл.<br><b>Применение:</b> Местно при открытоугольной глаукоме (снижает секрецию водянистой влаги цилиарным телом)." },
      { mod: "5", front: "Резерпин", back: "<b>Группа:</b> Симпатолитик (действует пресинаптически).<br><b>Доза:</b> Т 0,0001 и 0,00025.<br><b>Применение:</b> Нарушает депонирование норадреналина в везикулах (блок VMAT), истощая запасы медиатора. Применяется при АГ. Побочные: депрессия, паркинсонизм, ульцерогенность, брадикардия." },

      // ================= МОДУЛЬ 6: СНОТВОРНЫЕ, АНКСИОЛИТИКИ, ЭПИЛЕПСИЯ, ПАРКИНСОНИЗМ (12) =================
      { mod: "6", front: "Диазепам (Сибазон, Реланиум)", back: "<b>Группа:</b> Бензодиазепиновый анксиолитик (транквилизатор).<br><b>Доза:</b> Т 0,005; А 0,5% - 2 мл.<br><b>Применение:</b> Аллостерический активатор ГАМК-А рецепторов (увеличивает частоту открытия Cl- каналов). Неврозы, тревога, бессонница, премедикация, купирование эпилептического статуса (в/в)." },
      { mod: "6", front: "Феназепам (Бромдигидрохлорфенилбензодиазепин)", back: "<b>Группа:</b> Высокоактивный бензодиазепиновый транквилизатор и снотворное.<br><b>Доза:</b> Т 0,0005; 0,001; А 0,1% - 1 мл.<br><b>Применение:</b> Тревожные расстройства, панические атаки, фобии, расстройства сна, алкогольная абстиненция." },
      { mod: "6", front: "Медазепам / Тофизопам (Грандаксин)", back: "<b>Группа:</b> «Дневные» анксиолитики (бензодиазепины).<br><b>Доза:</b> Тофизопам Т 0,05.<br><b>Применение:</b> Устраняют тревогу и вегетативные нарушения без выраженной сонливости, седации и миорелаксации." },
      { mod: "6", front: "Флумазенил (Анексат)", back: "<b>Группа:</b> Специфический антагонист бензодиазепиновых рецепторов.<br><b>Доза:</b> А 0,01% - 5 мл (в/в).<br><b>Применение:</b> Антидот при острой передозировке бензодиазепинами и для выведения из бензодиазепиновой седации." },
      { mod: "6", front: "Золпидем / Зопиклон", back: "<b>Группа:</b> Небензодиазепиновые снотворные (Z-препараты).<br><b>Доза:</b> Золпидем Т 0,01; Зопиклон Т 0,0075.<br><b>Применение:</b> Селективные агонисты ω1-бензодиазепиновых рецепторов. Нарушения засыпания и ситуационная бессонница (не нарушают фазовую структуру сна)." },
      { mod: "6", front: "Фенобарбитал", back: "<b>Группа:</b> Барбитурат длительного действия (противоэпилептическое, снотворное).<br><b>Доза:</b> Т 0,05 и 0,1.<br><b>Применение:</b> Пролонгирует открытие Cl- каналов ГАМК-А рецептора. Эпилепсия (большие судорожные припадки), желтуха новорожденных (мощный индуктор ферментов печени CYP450)." },
      { mod: "6", front: "Вальпроевая кислота (Депакин)", back: "<b>Группа:</b> Противоэпилептическое средство широкого спектра.<br><b>Доза:</b> Т 0,3 и 0,5.<br><b>Применение:</b> Ингибирует ГАМК-трансаминазу (повышает уровень ГАМК в мозге) и блокирует Na+/Ca2+-каналы. Все формы эпилепсии (генерализованные, парциальные, абсансы)." },
      { mod: "6", front: "Карбамазепин (Финлепсин)", back: "<b>Группа:</b> Противоэпилептическое средство, блокатор потенциалзависимых Na+-каналов.<br><b>Доза:</b> Т 0,2.<br><b>Применение:</b> Парциальные и генерализованные тонико-клонические припадки, невралгия тройничного нерва (препарат выбора). Противопоказан при абсансах!" },
      { mod: "6", front: "Этосуксимид", back: "<b>Группа:</b> Противоэпилептическое средство (блокатор Ca2+-каналов Т-типа нейронов таламуса).<br><b>Доза:</b> К 0,25.<br><b>Применение:</b> Препарат выбора при малых припадках эпилепсии (абсансах / petit mal)." },
      { mod: "6", front: "Леводопа + Карбидопа (Наком)", back: "<b>Группа:</b> Дофаминергическое противопаркинсоническое средство.<br><b>Доза:</b> Т 250 мг + 25 мг.<br><b>Применение:</b> Леводопа проходит через ГЭБ и превращается в дофамин; Карбидопа блокирует периферическую ДОФА-декарбоксилазу, устраняя периферические побочные эффекты (аритмии, рвоту)." },
      { mod: "6", front: "Селегилин / Амантадин", back: "<b>Группа:</b> Противопаркинсонические средства.<br><b>Механизм:</b> Селегилин (Т 0,005) — селективный ингибитор МАО-В (тормозит распад дофамина). Амантадин (Т 0,1) — блок глутаматных NMDA-рецепторов и стимуляция выброса дофамина." },
      { mod: "6", front: "Тригексифенидил (Циклодол)", back: "<b>Группа:</b> Центральный М-холиноблокатор (противопаркинсоническое).<br><b>Доза:</b> Т 0,002.<br><b>Применение:</b> Болезнь Паркинсона и коррекция лекарственного паркинсонизма (экстрапирамидных расстройств), вызванного приемом типичных нейролептиков." },

      // ================= МОДУЛЬ 7: ПСИХОТРОПНЫЕ СРЕДСТВА (11) =================
      { mod: "7", front: "Хлорпромазин (Аминазин)", back: "<b>Группа:</b> Типичный антипсихотик (нейролептик), алифатическое производное фенотиазина.<br><b>Доза:</b> Т 0,025; А 2,5% - 2 мл.<br><b>Применение:</b> Блокирует D2, α1, M, H1-рецепторы. Психомоторное возбуждение, шизофрения, неукротимая рвота. Вызывает экстрапирамидные расстройства, гипотонию, гипотермию." },
      { mod: "7", front: "Галоперидол", back: "<b>Группа:</b> Типичный антипсихотик (производное бутирофенона).<br><b>Доза:</b> Т 0,0015 и 0,005; А 0,5% - 1 мл.<br><b>Применение:</b> Мощный блокатор центральных D2-рецепторов. Бред, галлюцинации, шизофрения, делирий, синдром Туретта. Высокий риск лекарственного паркинсонизма." },
      { mod: "7", front: "Дроперидол", back: "<b>Группа:</b> Типичный нейролептик короткого действия (бутирофенон).<br><b>Доза:</b> А 0,25% - 5 мл.<br><b>Применение:</b> Нейролептанальгезия (в комбинации с фентанилом — препарат Таламонал) при болевом шоке, инфаркте миокарда и операциях." },
      { mod: "7", front: "Клозапин (Азалептин) / Рисперидон", back: "<b>Группа:</b> Атипичные антипсихотики (блокаторы 5-HT2A и D2/D4-рецепторов).<br><b>Доза:</b> Клозапин Т 0,025 и 0,1; Рисперидон Т 0,002.<br><b>Применение:</b> Продуктивная и негативная симптоматика шизофрении без экстрапирамидных нарушений. Опасный побочный эффект клозапина — агранулоцитоз!" },
      { mod: "7", front: "Амитриптилин", back: "<b>Группа:</b> Трициклический антидепрессант (неизбирательный ингибитор обратного захвата серотонина и норадреналина).<br><b>Доза:</b> Т 0,025; А 1% - 2 мл.<br><b>Применение:</b> Тяжелые эндогенные депрессии с тревогой. Побочные (М-холиноблокада): сухость во рту, задержка мочи, запоры, тахикардия." },
      { mod: "7", front: "Флуоксетин (Прозак) / Сертралин", back: "<b>Группа:</b> Антидепрессанты группы СИОЗС (селективные ингибиторы обратного захвата серотонина).<br><b>Доза:</b> Флуоксетин К 0,02; Сертралин Т 0,05.<br><b>Применение:</b> Депрессии, ОКР, булимия. Не обладают кардиотоксичностью и М-холиноблокирующим действием." },
      { mod: "7", front: "Венлафаксин / Дулоксетин", back: "<b>Группа:</b> Антидепрессанты группы СИОЗСН (селективные ингибиторы обратного захвата серотонина и норадреналина).<br><b>Доза:</b> Венлафаксин Т 0,0375 и 0,075.<br><b>Применение:</b> Депрессии любого генеза, генерализованное тревожное расстройство, нейропатическая боль." },
      { mod: "7", front: "Ниаламид / Моклобемид", back: "<b>Группа:</b> Антидепрессанты — ингибиторы МАО.<br><b>Особенности:</b> Ниаламид — необратимый ИМАО (опасен «сырным синдромом» — тираминовый гипертонический криз). Моклобемид (Т 0,15) — обратимый селективный ИМАО-А." },
      { mod: "7", front: "Лития карбонат (Седалит)", back: "<b>Группа:</b> Нормотимик (стабилизатор настроения).<br><b>Доза:</b> Т 0,3.<br><b>Применение:</b> Лечение и профилактика маниакальной фазы биполярного аффективного расстройства (БАР). Узкая терапевтическая широта (требует контроля концентрации Li+ в крови)." },
      { mod: "7", front: "Кофеин-бензоат натрия", back: "<b>Группа:</b> Психостимулятор и аналептик (метилксантин).<br><b>Доза:</b> Т 0,1 и 0,2; А 10% и 20% - 1 мл.<br><b>Применение:</b> Блокирует центральные аденозиновые рецепторы (A1, A2A) и ингибирует фосфодиэстеразу. Умственное и физическое утомление, гипотония, мигрень." },
      { mod: "7", front: "Пирацетам (Ноотропил)", back: "<b>Группа:</b> Ноотропное средство (производное ГАМК).<br><b>Доза:</b> К 0,4; Т 0,8; А 20% - 5 мл.<br><b>Применение:</b> Улучшает энергетический метаболизм мозга, утилизацию глюкозы, микроциркуляцию и когнитивные функции (память, обучение) после инсультов, ЧМТ и при деменции." },

      // ================= МОДУЛЬ 8: АНАЛЬГЕТИКИ И АНЕСТЕТИКИ (11) =================
      { mod: "8", front: "Морфин", back: "<b>Группа:</b> Опиоидный (наркотический) анальгетик, полный агонист μ-рецепторов.<br><b>Доза:</b> А 1% - 1 мл; Т пролонг. 0,01; 0,03.<br><b>Применение:</b> Травматический и ожоговый шок, инфаркт миокарда, онкологические боли, отек легких. Триада передозировки: кома, точечный миоз, угнетение дыхания." },
      { mod: "8", front: "Фентанил", back: "<b>Группа:</b> Синтетический опиоидный анальгетик (в 100 раз сильнее морфина, действует 20–30 мин).<br><b>Доза:</b> А 0,005% - 2 мл; ТТС (пластырь).<br><b>Применение:</b> Премедикация, вводный наркоз, нейролептанальгезия (с дроперидолом), инфаркт миокарда, хронический болевой синдром в онкологии." },
      { mod: "8", front: "Тримеперидин (Промедол)", back: "<b>Группа:</b> Синтетический опиоидный анальгетик.<br><b>Доза:</b> А 1% и 2% - 1 мл; Т 0,025.<br><b>Применение:</b> Травмы, послеоперационные боли, обезболивание родов (расслабляет шейку матки), почечная и печеночная колики (меньше спазмирует сфинктер Одди, чем морфин)." },
      { mod: "8", front: "Трамадол", back: "<b>Группа:</b> Анальгетик смешанного механизма (слабый агонист μ-опиоидных рецепторов + блок обратного захвата серотонина и норадреналина).<br><b>Доза:</b> К 0,05; А 5% - 2 мл.<br><b>Применение:</b> Болевой синдром средней и сильной интенсивности (травмы, операции, онкология)." },
      { mod: "8", front: "Налоксон", back: "<b>Группа:</b> Чистый конкурентный антагонист всех типов опиоидных рецепторов.<br><b>Доза:</b> А 0,04% - 1 мл (0,4 мг/мл).<br><b>Применение:</b> Специфический антидот при острой интоксикации и угнетении дыхания опиоидными анальгетиками (морфином, героином, фентанилом)." },
      { mod: "8", front: "Парацетамол (Ацетаминофен)", back: "<b>Группа:</b> Неопиоидный анальгетик-антипиретик центрального действия (блокатор ЦОГ-3 в ЦНС).<br><b>Доза:</b> Т 0,5; супп. 0,1–0,5.<br><b>Применение:</b> Лихорадка и боль слабой/умеренной интенсивности (не имеет противовоспалительного эффекта). При передозировке вызывает некроз печени; <b>антидот — Ацетилцистеин</b>." },
      { mod: "8", front: "Прокаин (Новокаин)", back: "<b>Группа:</b> Местный анестетик (сложный эфир парааминобензойной кислоты) короткого действия (30–60 мин).<br><b>Доза:</b> А 0,25% и 0,5% (инфильтрационная); 1% и 2% (проводниковая).<br><b>Механизм:</b> Блокирует потенциалзависимые Na+-каналы мембран нервных волокон. Не работает в очаге воспаления (в кислой среде)!" },
      { mod: "8", front: "Лидокаин", back: "<b>Группа:</b> Местный анестетик амидного типа средней продолжительности (1,5–2 ч) и антиаритмик IB класса.<br><b>Доза:</b> А 2% - 2 мл; спрей 10%; А 10% - 2 мл.<br><b>Применение:</b> Все виды местной анестезии (терминальная, инфильтрационная, проводниковая, эпидуральная) и желудочковые аритмии." },
      { mod: "8", front: "Бупивакаин / Артикаин (Ультракаин)", back: "<b>Группа:</b> Местные анестетики амидного типа высокой активности.<br><b>Доза:</b> Бупивакаин фл. 0,5% - 4 мл; Артикаин карпулы 4% - 1,7 мл.<br><b>Применение:</b> Спинальная и эпидуральная анестезия (бупивакаин — до 6 ч), стоматологическая практика (артикаин)." },
      { mod: "8", front: "Пропофол / Кетамин", back: "<b>Группа:</b> Средства для неингаляционного (внутривенного) наркоза.<br><b>Особенности:</b> Пропофол (А 1% - 20 мл) — быстрый сон без стадии возбуждения. Кетамин (А 5% - 2 мл, блокатор NMDA-рецепторов) — вызывает «диссоциативную анестезию» с сохранением самостоятельного дыхания и повышением АД." },
      { mod: "8", front: "Севофлуран / Изофлуран", back: "<b>Группа:</b> Средства для ингаляционного наркоза (летучие жидкости).<br><b>Доза:</b> Флаконы 100 и 250 мл для испарителей.<br><b>Применение:</b> Вводная и поддерживающая общая анестезия в хирургии (быстрое введение в наркоз и быстрое пробуждение, не раздражают дыхательные пути)." },

      // ================= МОДУЛЬ 9: НПВП, ПРОТИВОАЛЛЕРГИЧЕСКИЕ И ГОРМОНЫ (11) =================
      { mod: "9", front: "Ацетилсалициловая кислота (Аспирин)", back: "<b>Группа:</b> Неселективный ингибитор ЦОГ-1 и ЦОГ-2 (НПВП) и антиагрегант.<br><b>Доза:</b> Т 0,5 (жаропонижающее/НПВП); Т 0,075–0,1 (Тромбо АСС, Кардиомагнил — антиагрегант).<br><b>Побочные:</b> Ульцерогенность (язвы ЖКТ), бронхоспазм, у детей при вирусных инфекциях — <b>синдром Рея</b> (противопоказан до 15 лет!)." },
      { mod: "9", front: "Диклофенак / Кеторолак", back: "<b>Группа:</b> Неселективные ингибиторы ЦОГ-1 и ЦОГ-2.<br><b>Доза:</b> Диклофенак Т 0,05; А 2,5% - 3 мл; Кеторолак Т 0,01; А 3% - 1 мл.<br><b>Применение:</b> Диклофенак — лидер по противовоспалительной активности (артриты, остеохондроз). Кеторолак — мощный анальгетик при травмах и послеоперационных болях." },
      { mod: "9", front: "Ибупрофен", back: "<b>Группа:</b> Неселективный ингибитор ЦОГ-1 и ЦОГ-2 (производное пропионовой кислоты).<br><b>Доза:</b> Т 0,2 и 0,4; суспензия 100 мг/5 мл.<br><b>Применение:</b> Лихорадка, болевой и воспалительный синдром. Разрешен в педиатрической практике с 3 месяцев." },
      { mod: "9", front: "Мелоксикам (Мовалис) / Нимесулид", back: "<b>Группа:</b> Преимущественно селективные ингибиторы ЦОГ-2 (НПВП).<br><b>Доза:</b> Мелоксикам Т 0,0075 и 0,015; А 1% - 1,5 мл; Нимесулид Т 0,1.<br><b>Применение:</b> Ревматоидный артрит, остеоартроз, болезнь Бехтерева (меньше повреждают слизистую желудка, чем неселективные НПВП)." },
      { mod: "9", front: "Целекоксиб (Целебрекс) / Эторикоксиб", back: "<b>Группа:</b> Высокоселективные ингибиторы ЦОГ-2 (коксибы).<br><b>Доза:</b> Целекоксиб К 0,1 и 0,2.<br><b>Применение:</b> Воспалительные заболевания суставов у пациентов с высоким риском язвы желудка. Повышают риск тромбозов (требуют осторожности при ИБС)." },
      { mod: "9", front: "Преднизолон / Дексаметазон", back: "<b>Группа:</b> Синтетические глюкокортикостероиды (ГКС).<br><b>Доза:</b> Преднизолон Т 0,005; А 3% - 1 мл; Дексаметазон Т 0,0005; А 0,4% - 1 мл.<br><b>Механизм:</b> Индуцируют липокортин-1, угнетая фосфолипазу А2. Мощное противовоспалительное, противоаллергическое, иммунодепрессивное и противошоковое действие. Побочные: синдром Кушинга, стероидный диабет, язвы, остеопороз, синдром отмены." },
      { mod: "9", front: "Беклометазон / Будесонид (Пульмикорт)", back: "<b>Группа:</b> Ингаляционные глюкокортикостероиды (ИГКС).<br><b>Доза:</b> Будесонид суспензия для небулайзера 0,25 и 0,5 мг/мл.<br><b>Применение:</b> Основа базисной противовоспалительной терапии бронхиальной астмы и стенозирующего ларинготрахеита. Профилактика кандидоза полости рта — полоскание водой после ингаляции." },
      { mod: "9", front: "Дифенгидрамин (Димедрол) / Хлоропирамин (Супрастин)", back: "<b>Группа:</b> Блокаторы H1-гистаминовых рецепторов I поколения.<br><b>Доза:</b> Димедрол Т 0,05; А 1% - 1 мл; Супрастин Т 0,025; А 2% - 1 мл.<br><b>Применение:</b> Острые аллергические реакции (крапивница, отек Квинке), премедикация. Проникают через ГЭБ — вызывают выраженную седацию, сонливость и М-холиноблокаду." },
      { mod: "9", front: "Лоратадин / Цетиризин", back: "<b>Группа:</b> Селективные блокаторы периферических H1-гистаминовых рецепторов II поколения.<br><b>Доза:</b> Т 0,01 (1 раз в сутки).<br><b>Применение:</b> Аллергический ринит, конъюнктивит, поллиноз, крапивница. Не проникают через ГЭБ, не вызывают сонливости и не усиливают действие алкоголя." },
      { mod: "9", front: "Кромоглициевая кислота / Кетотифен", back: "<b>Группа:</b> Стабилизаторы мембран тучных клеток.<br><b>Доза:</b> Кетотифен Т 0,001.<br><b>Применение:</b> Препятствуют входу Ca2+ в тучные клетки и их дегрануляции (выбросу гистамина). Только для профилактики приступов бронхиальной астмы и поллинозов!" },
      { mod: "9", front: "Инсулин / Метформин / Левотироксин", back: "<b>Группа:</b> Гормональные и сахароснижающие средства.<br><b>Применение:</b> Инсулин (п/к ЕД) — СД 1 типа. Метформин (Т 0,5; 0,85; 1,0 — бигуанид, снижает инсулинорезистентность) — препарат 1-й линии при СД 2 типа. L-тироксин (Т 50 и 100 мкг) — гипотиреоз." },

      // ================= МОДУЛЬ 10: ДЫХАНИЕ И ЖКТ (11) =================
      { mod: "10", front: "Бутамират (Синекод) / Преноксдиазин (Либексин)", back: "<b>Группа:</b> Неопиоидные противокашлевые средства.<br><b>Доза:</b> Бутамират капли/сироп; Преноксдиазин Т 0,1.<br><b>Применение:</b> Сухой изнуряющий непродуктивный кашель (коклюш, плеврит, подготовка к бронхоскопии). Бутамират действует центрально (не угнетая дыхание), Преноксдиазин — периферически (анестезирует рецепторы бронхов)." },
      { mod: "10", front: "Амброксол (Лазолван) / Бромгексин", back: "<b>Группа:</b> Муколитические и мукорегуляторные отхаркивающие средства.<br><b>Доза:</b> Амброксол Т 0,03; р-р для ингаляций 7,5 мг/мл.<br><b>Применение:</b> Разжижают вязкую мокроту и стимулируют синтез сурфактанта альвеолоцитами II типа. Острые и хронические бронхиты, пневмонии, ХОБЛ." },
      { mod: "10", front: "Ацетилцистеин (АЦЦ)", back: "<b>Группа:</b> Муколитик прямого действия и антидот.<br><b>Доза:</b> Порошки и шипучие Т 0,2 и 0,6; А 10% - 3 мл.<br><b>Применение:</b> Свободные сульфгидрильные (-SH) группы разрывают дисульфидные связи мукополисахаридов мокроты. Также является специфическим антидотом при отравлении парацетамолом (донатор глутатиона)." },
      { mod: "10", front: "Омепразол / Пантопразол / Эзомепразол", back: "<b>Группа:</b> Ингибиторы протонной помпы (ИПП — блокаторы H+/K+-АТФазы париетальных клеток желудка).<br><b>Доза:</b> Омепразол К 0,02; Пантопразол Т 0,04.<br><b>Применение:</b> Самые мощные антисекреторные средства. Язвенная болезнь желудка и ДПК, ГЭРБ, синдром Золлингера-Эллисона, эрадикация H. pylori." },
      { mod: "10", front: "Фамотидин (Квамател)", back: "<b>Группа:</b> Блокатор H2-гистаминовых рецепторов париетальных клеток желудка.<br><b>Доза:</b> Т 0,02 и 0,04; фл. 0,02.<br><b>Применение:</b> Язвенная болезнь желудка и двенадцатиперстной кишки, рефлюкс-эзофагит, профилактика стрессовых и НПВП-индуцированных язв." },
      { mod: "10", front: "Алмагель / Маалокс (Алгелдрат + Магния гидроксид)", back: "<b>Группа:</b> Невсасывающиеся антацидные средства.<br><b>Доза:</b> Суспензия в пакетиках по 15 мл или флаконы 170 мл.<br><b>Применение:</b> Химически нейтрализуют соляную кислоту в просвете желудка без феномена «кислотного рикошета» (в отличие от соды). Изжога, гастрит, ГЭРБ." },
      { mod: "10", front: "Висмута трикалия дицитрат (Де-Нол) / Сукральфат", back: "<b>Группа:</b> Гастропротекторы (пленкообразующие).<br><b>Доза:</b> Де-Нол Т 0,12.<br><b>Применение:</b> В кислой среде желудка образуют защитную альбуминатную пленку только на поверхности язв и эрозий. Де-Нол также обладает бактерицидной активностью против Helicobacter pylori (окрашивает стул в темный цвет)." },
      { mod: "10", front: "Метоклопрамид (Церукал) / Домперидон (Мотилиум)", back: "<b>Группа:</b> Прокинетики и противорвотные средства (блокаторы D2-дофаминовых рецепторов).<br><b>Доза:</b> Т 0,01; Метоклопрамид А 0,5% - 2 мл.<br><b>Применение:</b> Тошнота и рвота любого генеза, атония желудка, рефлюкс-эзофагит. Домперидон не проникает через ГЭБ и не вызывает экстрапирамидных расстройств." },
      { mod: "10", front: "Ондансетрон (Латран)", back: "<b>Группа:</b> Мощное противорвотное средство (селективный блокатор серотониновых 5-HT3-рецепторов).<br><b>Доза:</b> Т 0,004 и 0,008; А 0,2% - 2 и 4 мл.<br><b>Применение:</b> Профилактика и купирование неукротимой тошноты и рвоты при цитостатической химиотерапии, лучевой терапии и в послеоперационном периоде." },
      { mod: "10", front: "Дротаверин (Но-шпа) / Мебеверин (Дюспаталин)", back: "<b>Группа:</b> Миотропные спазмолитики.<br><b>Доза:</b> Дротаверин Т 0,04; А 2% - 2 мл; Мебеверин К 0,2.<br><b>Применение:</b> Дротаверин ингибирует фосфодиэстеразу-4 (накапливает цАМФ), снимая спазмы гладкой мускулатуры ЖКТ, желчных и мочевыводящих путей." },
      { mod: "10", front: "Лоперамид (Имодиум) / Лактулоза (Дюфалак)", back: "<b>Лоперамид (К 0,002):</b> Антидиарейное средство (агонист периферических μ-опиоидных рецепторов кишечника, угнетает перистальтику).<br><b>Лактулоза (сироп):</b> Осмотическое слабительное и средство для лечения печеночной энцефалопатии (связывает аммиак в кишечнике)." },

      // ================= МОДУЛЬ 11: СЕРДЕЧНО-СОСУДИСТЫЕ СРЕДСТВА (12) =================
      { mod: "11", front: "Нитроглицерин", back: "<b>Группа:</b> Антиангинальное средство, органический нитрат (донатор оксида азота NO).<br><b>Доза:</b> Т сублингв. 0,0005; спрей 0,4 мг/доза; А 0,1% - 10 мл.<br><b>Применение:</b> Расширяет преимущественно вены (снижает преднагрузку на миокард и потребность в O2). Экстренное купирование приступа стенокардии. Побочные: пульсирующая головная боль, ортостатическая гипотония, толерантность." },
      { mod: "11", front: "Изосорбида динитрат / Изосорбида мононитрат", back: "<b>Группа:</b> Пролонгированные органические нитраты.<br><b>Доза:</b> Т 0,01; 0,02 и 0,04.<br><b>Применение:</b> Профилактика приступов стенокардии напряжения и хроническая сердечная недостаточность. Для профилактики толерантности требуют «безнитратного окна» 8–10 часов в сутки." },
      { mod: "11", front: "Верапамил / Дилтиазем", back: "<b>Группа:</b> Кардиоселективные блокаторы медленных Ca2+-каналов L-типа (фенилалкиламины и бензодиазепины), антиаритмики IV класса.<br><b>Доза:</b> Верапамил Т 0,04 и 0,08; А 0,25% - 2 мл.<br><b>Применение:</b> Наджелудочковые тахиаритмии, стенокардия, АГ. Замедляют ЧСС и АВ-проводимость (нельзя сочетать с β-блокаторами!)." },
      { mod: "11", front: "Амлодипин (Норваск) / Нифедипин", back: "<b>Группа:</b> Вазоселективные блокаторы медленных Ca2+-каналов L-типа (дигидропиридины).<br><b>Доза:</b> Амлодипин Т 0,005 и 0,01 (действует 24 ч); Нифедипин Т 0,01.<br><b>Применение:</b> Расширяют артериолы (снижают постнагрузку). Артериальная гипертензия, вазоспастическая стенокардия Принцметала. Побочные: отеки лодыжек, гиперемия лица." },
      { mod: "11", front: "Эналаприл / Лизиноприл / Периндоприл / Каптоприл", back: "<b>Группа:</b> Ингибиторы ангиотензинпревращающего фермента (иАПФ).<br><b>Доза:</b> Эналаприл Т 0,005; 0,01 и 0,02; Каптоприл Т 0,025 (под язык при кризе).<br><b>Применение:</b> Блокируют переход ангиотензина I в ангиотензин II и снижают уровень альдостерона. АГ, ХСН, диабетическая нефропатия. Побочные: сухой кашель (накопление брадикинина), гиперкалиемия, тератогенность." },
      { mod: "11", front: "Лозартан / Валсартан / Кандесартан", back: "<b>Группа:</b> Блокаторы рецепторов ангиотензина II (БРА / сартаны, блок AT1-рецепторов).<br><b>Доза:</b> Лозартан Т 0,05 и 0,1; Валсартан Т 0,08 и 0,16.<br><b>Применение:</b> Артериальная гипертензия и ХСН. Не влияют на распад брадикинина и НЕ вызывают сухого кашля!" },
      { mod: "11", front: "Дигоксин", back: "<b>Группа:</b> Сердечный гликозид (кардиотоник из наперстянки шерстистой).<br><b>Доза:</b> Т 0,00025; А 0,025% - 1 мл.<br><b>Механизм:</b> Блокирует Na+/K+-АТФазу мембраны кардиомиоцитов -> растет внутриклеточный Ca2+ -> усиливается систола (+ инотропный эффект). Применение: ХСН + мерцательная аритмия. Антидоты при интоксикации: препараты K+/Mg2+ (Панангин), Унитиол, антитела Дигибинд." },
      { mod: "11", front: "Аторвастатин / Розувастатин", back: "<b>Группа:</b> Гиполипидемические средства — ингибиторы ГМГ-КоА-редуктазы (статины).<br><b>Доза:</b> Т 0,01; 0,02; 0,04.<br><b>Применение:</b> Подавляют синтез холестерина в гепатоцитах и повышают число рецепторов к ЛПНП. Атеросклероз, ИБС, профилактика инфарктов и инсультов. Побочные: миопатия (рабдомиолиз), повышение АЛТ/АСТ." },
      { mod: "11", front: "Фенофибрат (Трайкор) / Эзетимиб", back: "<b>Фенофибрат (Т 0,145):</b> Фибрат (агонист рецепторов PPAR-альфа, активирует липопротеинлипазу, снижает триглицериды).<br><b>Эзетимиб (Т 0,01):</b> Ингибирует абсорбцию холестерина в тонком кишечнике." },
      { mod: "11", front: "Прокаинамид (Новокаинамид) / Пропафенон", back: "<b>Группа:</b> Антиаритмические средства I класса (блокаторы быстрых Na+-каналов, мембраностабилизирующие).<br><b>Доза:</b> Прокаинамид (IA класс) Т 0,25; А 10% - 5 мл; Пропафенон (IC класс) Т 0,15.<br><b>Применение:</b> Купирование и профилактика предсердных и желудочковых тахиаритмий, пароксизмов фибрилляции предсердий." },
      { mod: "11", front: "Амиодарон (Кордарон)", back: "<b>Группа:</b> Антиаритмическое средство III класса (блокатор K+-каналов, также блокирует Na+, Ca2+ и β-рецепторы).<br><b>Доза:</b> Т 0,2; А 5% - 3 мл.<br><b>Применение:</b> Удлиняет потенциал действия и эффективный рефрактерный период. Любые жизнеугрожающие желудочковые и наджелудочковые аритмии. Содержит йод (побочные: дисфункция щитовидной железы, фиброз легких)." },
      { mod: "11", front: "Соталол", back: "<b>Группа:</b> Антиаритмическое средство III класса с неселективной β-блокирующей активностью.<br><b>Доза:</b> Т 0,08 и 0,16.<br><b>Применение:</b> Профилактика пароксизмов фибрилляции предсердий и желудочковых тахикардий." },

      // ================= МОДУЛЬ 12: ДИУРЕТИЧЕСКИЕ СРЕДСТВА (8) =================
      { mod: "12", front: "Фуросемид (Лазикс)", back: "<b>Группа:</b> Мощный петлевой диуретик быстрого и короткого действия.<br><b>Доза:</b> Т 0,04; А 1% - 2 мл.<br><b>Механизм:</b> Блокирует симпортер Na+/K+/2Cl- в толстом восходящем отделе петли Генле. Применение: отек легких, отек мозга, гипертонический криз, ХСН, форсированный диурез. Побочные: гипокалиемия, гипомагниемия, ототоксичность." },
      { mod: "12", front: "Торасемид (Диувер, Тригрим)", back: "<b>Группа:</b> Петлевой диуретик с антиальдостероновой активностью.<br><b>Доза:</b> Т 0,005 и 0,01.<br><b>Применение:</b> Отечный синдром при ХСН, заболеваниях печени и почек, артериальная гипертензия (реже вызывает гипокалиемию, чем фуросемид)." },
      { mod: "12", front: "Гидрохлоротиазид (Гипотиазид)", back: "<b>Группа:</b> Тиазидный диуретик средней силы и длительности действия.<br><b>Доза:</b> Т 0,025 и 0,1.<br><b>Механизм:</b> Блокирует ко-транспортер Na+/Cl- в начальном отделе дистальных извитых канальцев. Применение: артериальная гипертензия, хронические отеки. Побочные: гипокалиемия, гиперурикемия (обострение подагры), гипергликемия." },
      { mod: "12", front: "Индапамид (Арифон)", back: "<b>Группа:</b> Тиазидоподобный диуретик с прямым вазодилатирующим действием.<br><b>Доза:</b> Т 0,0025; Т ретард 0,0015.<br><b>Применение:</b> Базисная терапия эссенциальной артериальной гипертензии (метаболически нейтрален — не повышает глюкозу и липиды)." },
      { mod: "12", front: "Спиронолактон (Верошпирон) / Эплеренон", back: "<b>Группа:</b> Калийсберегающие диуретики — конкурентные антагонисты рецепторов альдостерона.<br><b>Доза:</b> Спиронолактон Т 0,025; К 0,05 и 0,1.<br><b>Применение:</b> Действуют в собирательных трубочках (задерживают K+ и Mg2+, выводят Na+ и воду). ХСН, асцит при циррозе печени, гиперальдостеронизм. Побочные: гиперкалиемия, гинекомастия (у спиронолактона)." },
      { mod: "12", front: "Триамтерен / Амилорид", back: "<b>Группа:</b> Калийсберегающие диуретики (прямые блокаторы эпителиальных Na+-каналов собирательных трубок).<br><b>Применение:</b> Действуют независимо от уровня альдостерона. Обычно применяются в комбинированных препаратах с гидрохлоротиазидом (Триампур композитум) для профилактики потери калия." },
      { mod: "12", front: "Маннитол (Маннит)", back: "<b>Группа:</b> Осмотический диуретик.<br><b>Доза:</b> Флаконы 15% - 200 и 400 мл (в/в капельно).<br><b>Механизм:</b> Повышает осмотическое давление в плазме и просвете канальцев, удерживая воду («дегидратирующий эффект»). Применение: отек мозга, острый приступ глаукомы, острая почечная недостаточность, форсированный диурез." },
      { mod: "12", front: "Ацетазоламид (Диакарб)", back: "<b>Группа:</b> Диуретик — ингибитор карбоангидразы.<br><b>Доза:</b> Т 0,25.<br><b>Применение:</b> Угнетает карбоангидразу проксимальных канальцев, ресничного тела глаза и сосудистых сплетений мозга. Глаукома, внутричерепная гипертензия, горная болезнь." },

      // ================= МОДУЛЬ 13: СРЕДСТВА, ВЛИЯЮЩИЕ НА ГЕМОСТАЗ (10) =================
      { mod: "13", front: "Гепарин натрия", back: "<b>Группа:</b> Антикоагулянт прямого действия (нефракционированный).<br><b>Доза:</b> Флаконы 5000 МЕ/мл - 5 мл (п/к и в/в).<br><b>Механизм:</b> Активирует антитромбин III в плазме крови, инактивируя тромбин (IIa) и фактор Xa. <b>Лабораторный контроль:</b> АЧТВ. <b>Специфический антидот:</b> Протамина сульфат." },
      { mod: "13", front: "Эноксапарин (Клексан) / Надропарин (Фраксипарин)", back: "<b>Группа:</b> Низкомолекулярные гепарины (НМГ — антикоагулянты прямого действия).<br><b>Доза:</b> Шприцы 0,2; 0,4; 0,6 и 0,8 мл (п/к в живот).<br><b>Особенность:</b> Преимущественно ингибируют фактор Xa, имеют 100% биодоступность при п/к введении, реже вызывают кровотечения и тромбоцитопению, не требуют рутинного контроля АЧТВ." },
      { mod: "13", front: "Протамина сульфат", back: "<b>Группа:</b> Специфический антагонист (антидот) гепарина.<br><b>Доза:</b> А 1% - 5 мл (в/в медленно).<br><b>Механизм:</b> Основной пептид, который электростатически связывается с кислыми молекулами гепарина (1 мг нейтрализует 100 МЕ гепарина)." },
      { mod: "13", front: "Варфарин", back: "<b>Группа:</b> Антикоагулянт непрямого действия (антагонист витамина K).<br><b>Доза:</b> Т 0,0025 (2,5 мг).<br><b>Механизм:</b> Блокирует эпоксидредуктазу витамина K в печени, нарушая синтез факторов свертывания II, VII, IX, X. Эффект развивается через 3–5 дней. <b>Контроль:</b> МНО (2,0–3,0). <b>Антидот:</b> Витамин K (Фитоменадион / Викасол)." },
      { mod: "13", front: "Ривароксабан (Ксарелто) / Дабигатран (Прадакса)", back: "<b>Группа:</b> Прямые оральные антикоагулянты (ПОАК / НОАК).<br><b>Доза:</b> Ривароксабан Т 0,01; 0,015 и 0,02; Дабигатран К 0,11 и 0,15.<br><b>Механизм:</b> Ривароксабан и Апиксабан — прямые ингибиторы фактора Xa; Дабигатран — прямой ингибитор тромбина (IIa). Не требуют подбора дозы по МНО." },
      { mod: "13", front: "Клопидогрел (Плавикс) / Тикагрелор (Брилинта)", back: "<b>Группа:</b> Антиагреганты (блокаторы пуриновых P2Y12-рецепторов тромбоцитов к АДФ).<br><b>Доза:</b> Клопидогрел Т 0,075; Тикагрелор Т 0,09.<br><b>Применение:</b> Острый коронарный синдром, стентирование коронарных артерий (двойная антиагрегантная терапия с аспирином), профилактика ишемического инсульта." },
      { mod: "13", front: "Алтеплаза (Актилизе) / Тенектеплаза", back: "<b>Группа:</b> Фибринолитики (тромболитики) — рекомбинантные тканевые активаторы плазминогена (t-PA).<br><b>Доза:</b> Флаконы 50 мг (в/в).<br><b>Механизм:</b> Избирательно на поверхности тромба превращают плазминоген в плазмин, растворяя нити фибрина в первые часы инфаркта миокарда, ишемического инсульта и ТЭЛА." },
      { mod: "13", front: "Транексамовая кислота / Аминокапроновая кислота", back: "<b>Группа:</b> Гемостатики — ингибиторы фибринолиза.<br><b>Доза:</b> Транексам Т 0,25 и 0,5; А 5% - 5 мл; АКК фл. 5% - 100 мл.<br><b>Механизм:</b> Конкурентно блокируют активацию плазминогена и угнетают плазмин. Применение: хирургические, маточные, носовые кровотечения, передозировка фибринолитиков." },
      { mod: "13", front: "Менадиона натрия бисульфит (Викасол)", back: "<b>Группа:</b> Коагулянт непрямого действия (синтетический водорастворимый аналог витамина K3).<br><b>Доза:</b> Т 0,015; А 1% - 1 мл.<br><b>Применение:</b> Стимулирует синтез протромбина и факторов VII, IX, X в печени (эффект наступает через 12–24 ч!). Паренхиматозные кровотечения, передозировка варфарина." },
      { mod: "13", front: "Этамзилат (Дицинон)", back: "<b>Группа:</b> Гемостатическое и ангиопротекторное средство (активатор образования тромбопластина).<br><b>Доза:</b> Т 0,25; А 12,5% - 2 мл.<br><b>Применение:</b> Улучшает адгезию тромбоцитов и снижает проницаемость капилляров при капиллярных и паренхиматозных кровотечениях." },

      // ================= МОДУЛЬ 14: АНТИБИОТИКИ — I (10) =================
      { mod: "14", front: "Бензилпенициллина натриевая соль", back: "<b>Группа:</b> Природный β-лактамный антибиотик (пенициллин) короткого действия (вводят каждые 4 часа).<br><b>Доза:</b> Флаконы 500 000 ЕД и 1 000 000 ЕД.<br><b>Механизм:</b> Бактерицидно ингибирует транспептидазу и синтез пептидогликана клеточной стенки. Спектр: Грам(+) кокки (стрептококки, пневмококки), менингококк, бледная трепонема (сифилис). Разрушается β-лактамазами и HCl желудка!" },
      { mod: "14", front: "Амоксициллин", back: "<b>Группа:</b> Полусинтетический аминопенициллин широкого спектра действия.<br><b>Доза:</b> Т и К 0,25; 0,5 и 1,0.<br><b>Применение:</b> Кислотоустойчив (принимается внутрь). Инфекции ЛОР-органов, дыхательных и мочевыводящих путей, эрадикация Helicobacter pylori. Разрушается пенициллиназами стафилококков." },
      { mod: "14", front: "Амоксициллин + Клавулановая кислота (Амоксиклав, Аугментин)", back: "<b>Группа:</b> Ингибиторозащищенный аминопенициллин.<br><b>Доза:</b> Т 0,625 (500+125 мг) и 1,0 (875+125 мг); фл. 1,2 г.<br><b>Суть:</b> Клавулановая кислота необратимо связывает бактериальные β-лактамазы, защищая амоксициллин от разрушения. Синусит, отит, пневмония, пиелонефрит, инфекции кожи." },
      { mod: "14", front: "Цефазолин", back: "<b>Группа:</b> Цефалоспорин I поколения (парентеральный).<br><b>Доза:</b> Флаконы 0,5 и 1,0 г.<br><b>Применение:</b> Преимущественно Грам(+) флора (стафилококки, стрептококки). Инфекции кожи и мягких тканей, периоперационная антибиотикопрофилактика в хирургии. Не проникает через ГЭБ." },
      { mod: "14", front: "Цефуроксим (Зиннат)", back: "<b>Группа:</b> Цефалоспорин II поколения.<br><b>Доза:</b> Т 0,25 и 0,5; фл. 0,75 и 1,5 г.<br><b>Применение:</b> Активен против Грам(+) кокков и части Грам(-) бактерий (H. influenzae, M. catarrhalis). Инфекции дыхательных и мочевыводящих путей." },
      { mod: "14", front: "Цефтриаксон / Цефотаксим", back: "<b>Группа:</b> Цефалоспорины III поколения широкого спектра (парентеральные).<br><b>Доза:</b> Флаконы 1,0 и 2,0 г (Цефтриаксон вводится 1 раз в сутки!).<br><b>Применение:</b> Высокая активность против Грам(-) бактерий, гонококка, менингококка. Отлично проникают через ГЭБ (препараты выбора при бактериальном менингите), пневмонии, пиелонефрите." },
      { mod: "14", front: "Цефтазидим / Цефоперазон", back: "<b>Группа:</b> «Антисинегнойные» цефалоспорины III поколения.<br><b>Доза:</b> Флаконы 1,0 и 2,0 г.<br><b>Применение:</b> Госпитальные инфекции, вызванные синегнойной палочкой (Pseudomonas aeruginosa)." },
      { mod: "14", front: "Цефепим (Максипим)", back: "<b>Группа:</b> Цефалоспорин IV поколения.<br><b>Доза:</b> Флаконы 1,0 и 2,0 г (в/в, в/м).<br><b>Применение:</b> Сочетает высокую активность против Грам(+) кокков и Грам(-) бактерий (включая синегнойную палочку), устойчив к хромосомным β-лактамазам. Тяжелые внутрибольничные инфекции, сепсис, фебрильная нейтропения." },
      { mod: "14", front: "Имипенем + Циластатин (Тиенам) / Меропенем", back: "<b>Группа:</b> Карбапенемы (β-лактамные антибиотики резерва сверхширокого спектра).<br><b>Доза:</b> Флаконы 0,5 и 1,0 г (в/в).<br><b>Особенность:</b> Действуют на Грам(+), Грам(-) и анаэробы. <b>Циластатин</b> блокирует почечную дегидропептидазу-I, предотвращая разрушение имипенема в почках (меропенем устойчив к ней сам)." },
      { mod: "14", front: "Азитромицин (Сумамед) / Кларитромицин", back: "<b>Группа:</b> Макролиды (Азитромицин — азалид).<br><b>Доза:</b> Азитромицин Т/К 0,25 и 0,5 (1 раз в сутки курсом 3–5 дней); Кларитромицин Т 0,25 и 0,5.<br><b>Механизм:</b> Бактериостатически блокируют 50S субъединицу рибосом. Накапливаются внутри клеток — препараты выбора при атипичных инфекциях (микоплазмы, хламидии, легионеллы) и аллергии на β-лактамы." },

      // ================= МОДУЛЬ 15: АНТИБИОТИКИ — II (11) =================
      { mod: "15", front: "Гентамицин / Амикацин", back: "<b>Группа:</b> Аминогликозиды (II и III поколение).<br><b>Доза:</b> Гентамицин А 4% - 2 мл (80 мг); Амикацин фл. 0,5 г.<br><b>Механизм:</b> Бактерицидно и необратимо блокируют 30S субъединицу рибосом. Активны против аэробной Грам(-) флоры (не действуют на анаэробы!). <b>Побочные эффекты:</b> Ототоксичность, нефротоксичность и нервно-мышечная блокада." },
      { mod: "15", front: "Доксициклин (Юнидокс Солютаб) / Тетрациклин", back: "<b>Группа:</b> Тетрациклины (бактериостатический блок 30S рибосом).<br><b>Доза:</b> Доксициклин Т 0,1.<br><b>Применение:</b> Хламидиоз, микоплазмоз, боррелиоз (болезнь Лайма), бруцеллез, риккетсиозы, чума, угревая сыпь. <b>Противопоказаны беременным и детям до 8 лет</b> (образуют хелаты с Ca2+ в костях и эмали зубов!). Вызывают фотосенсибилизацию." },
      { mod: "15", front: "Ципрофлоксацин / Левофлоксацин / Моксифлоксацин", back: "<b>Группа:</b> Фторхинолоны (II, III и IV поколение).<br><b>Доза:</b> Ципрофлоксацин Т 0,25 и 0,5; Левофлоксацин Т 0,5.<br><b>Механизм:</b> Бактерицидно ингибируют ДНК-гиразу (топоизомеразу II) и топоизомеразу IV бактерий. Лево- и моксифлоксацин — «респираторные» фторхинолоны (активны против пневмококка). Противопоказаны детям до 18 лет (повреждают хрящевую ткань!)." },
      { mod: "15", front: "Ванкомицин", back: "<b>Группа:</b> Гликопептидный антибиотик резерва (блокирует синтез клеточной стенки на этапе D-аланил-D-аланина).<br><b>Доза:</b> Флаконы 0,5 и 1,0 г (в/в капельно медленно; при быстром введении — «синдром красного человека»).<br><b>Применение:</b> Тяжелые инфекции, вызванные метициллин-резистентным золотистым стафилококком (MRSA), и псевдомембранозный колит C. difficile (внутрь)." },
      { mod: "15", front: "Линкомицин / Клиндамицин (Далацин)", back: "<b>Группа:</b> Линкозамиды (бактериостатический блок 50S субъединицы рибосом).<br><b>Доза:</b> Клиндамицин К 0,15 и 0,3; А 15% - 2 и 4 мл.<br><b>Применение:</b> Грам(+) кокки и неспорообразующие анаэробы. Хорошо накапливаются в костной ткани — остеомиелит, гнойные инфекции челюстно-лицевой области. Опасный побочный эффект — псевдомембранозный колит!" },
      { mod: "15", front: "Хлорамфеникол (Левомицетин)", back: "<b>Группа:</b> Амфеникол (бактериостатический блок 50S субъединицы рибосом).<br><b>Доза:</b> Т 0,25 и 0,5; глазные капли 0,25% - 10 мл.<br><b>Применение:</b> Местно в офтальмологии. Системно — только как резерв при брюшном тифе, сальмонеллезе и риккетсиозах из-за тяжелой миелотоксичности (апластическая анемия, агранулоцитоз, «серый синдром» у новорожденных)." },
      { mod: "15", front: "Линезолид (Зивокс)", back: "<b>Группа:</b> Оксазолидинон (синтетический антибиотик резерва, блок 50S рибосом).<br><b>Доза:</b> Т 0,6; р-р для инфузий 2 мг/мл - 300 мл.<br><b>Применение:</b> Полирезистентные Грам(+) инфекции: MRSA и ванкомицин-резистентные энтерококки (VRE)." },
      { mod: "15", front: "Ко-тримоксазол (Бисептол)", back: "<b>Группа:</b> Комбинированный сульфаниламидный препарат (Сульфаметоксазол + Триметоприм в соотношении 5:1).<br><b>Доза:</b> Т 0,48 (400+80 мг).<br><b>Механизм:</b> Двойной последовательный блок синтеза фолиевой кислоты у бактерий (дает бактерицидный эффект). Пневмоцистная пневмония при ВИЧ, инфекции мочевых путей. Запивать щелочной водой для профилактики кристаллурии!" },
      { mod: "15", front: "Метронидазол (Трихопол)", back: "<b>Группа:</b> Производное 5-нитроимидазола (противопротозойное и антианаэробное средство).<br><b>Доза:</b> Т 0,25 и 0,5; фл. 0,5% - 100 мл.<br><b>Применение:</b> Облигатные анаэробные бактерии (Bacteroides, Clostridium difficile), Helicobacter pylori и простейшие (трихомониаз, лямблиоз, амебиаз). Несовместим с алкоголем (тетурамоподобная реакция)." },
      { mod: "15", front: "Изониазид", back: "<b>Группа:</b> Противотуберкулезный препарат I ряда (гидразид изоникотиновой кислоты — ГИНК).<br><b>Доза:</b> Т 0,1; 0,2 и 0,3.<br><b>Механизм:</b> Бактерицидно подавляет синтез миколовых кислот клеточной стенки Mycobacterium tuberculosis. Побочные: гепатотоксичность и периферические полиневриты (профилактика — витамин B6 / пиридоксин)." },
      { mod: "15", front: "Рифампицин", back: "<b>Группа:</b> Противотуберкулезный антибиотик I ряда широкого спектра.<br><b>Доза:</b> К 0,15 и 0,3.<br><b>Механизм:</b> Ингибирует ДНК-зависимую РНК-полимеразу микобактерий. Туберкулез, лепра, бруцеллез. Мощный индуктор ферментов печени CYP450, окрашивает мочу, слезу и пот в красно-оранжевый цвет." },

      // ================= МОДУЛЬ 16: ПРОТИВОВИРУСНЫЕ И ПРОТИВООПУХОЛЕВЫЕ (10) =================
      { mod: "16", front: "Ацикловир (Зовиракс) / Валацикловир", back: "<b>Группа:</b> Противогерпетические средства (аномальные нуклеозиды — аналоги гуанозина).<br><b>Доза:</b> Ацикловир Т 0,2 и 0,4; мазь 5%; фл. 0,25 г.<br><b>Механизм:</b> Избирательно фосфорилируется вирусной тимидинкиназой до трифосфата, ингибирует вирусную ДНК-полимеразу и обрывает синтез цепи ДНК вируса. Применение: Вирус простого герпеса (HSV-1, 2) и Varicella-Zoster (ветряная оспа, опоясывающий лишай)." },
      { mod: "16", front: "Ганцикловир (Цимевен)", back: "<b>Группа:</b> Противовирусное средство (аналог нуклеозида гуанина).<br><b>Доза:</b> Флаконы 0,5 г (в/в).<br><b>Применение:</b> Препарат выбора при тяжелой цитомегаловирусной инфекции (ЦМВ-ретинит, пневмония у пациентов с иммунодефицитом и после трансплантации). Побочный эффект — угнетение костного мозга (нейтропения)." },
      { mod: "16", front: "Осельтамивир (Тамифлю) / Занамивир", back: "<b>Группа:</b> Противогриппозные средства — селективные ингибиторы нейраминидазы вирусов гриппа А и В.<br><b>Доза:</b> Осельтамивир К 0,075 (2 раза в день 5 дней).<br><b>Механизм:</b> Блокируют фермент нейраминидазу, препятствуя отщеплению новых вирусных частиц от инфицированной клетки и их дальнейшему распространению." },
      { mod: "16", front: "Зидовудин / Ламивудин / Тенофовир", back: "<b>Группа:</b> Антиретровирусные препараты (АРВТ) — нуклеозидные ингибиторы обратной транскриптазы (НИОТ).<br><b>Доза:</b> Зидовудин К 0,1 и Т 0,3.<br><b>Механизм:</b> Блокируют фермент обратную транскриптазу ВИЧ (синтез вирусной ДНК на матрице РНК). Базовые компоненты комбинированной терапии ВИЧ-инфекции и профилактики передачи ВИЧ от матери плоду." },
      { mod: "16", front: "Интерферон альфа-2b (Виферон, Гриппферон)", back: "<b>Группа:</b> Противовирусные и иммуномодулирующие средства (рекомбинантные цитокины).<br><b>Применение:</b> Активируют внутриклеточные ферменты (протеинкиназу и 2',5'-олигоаденилатсинтетазу), разрушающие вирусную иРНК и блокирующие трансляцию вирусных белков." },
      { mod: "16", front: "Циклофосфамид / Цисплатин", back: "<b>Группа:</b> Противоопухолевые цитостатики — алкилирующие соединения.<br><b>Механизм:</b> Образуют поперечные сшивки нитей ДНК, блокируя митоз опухолевых клеток. Циклофосфамид может вызывать геморрагический цистит (<b>антидот-уропротектор — Месна</b>); Цисплатин — выраженную нефротоксичность и рвоту." },
      { mod: "16", front: "Метотрексат", back: "<b>Группа:</b> Противоопухолевый цитостатик (антиметаболит фолиевой кислоты) и базисный иммунодепрессант.<br><b>Доза:</b> Т 0,0025; 0,005 и 0,01.<br><b>Механизм:</b> Ингибирует дигидрофолатредуктазу (ДГФР), нарушая синтез тимидилата и пуринов. Применение: острые лейкозы, лимфомы, ревматоидный артрит, псориаз. <b>Антидот при передозировке:</b> Кальция фолинат (Лейковорин)." },
      { mod: "16", front: "Фторурацил (5-Фторурацил) / Цитарабин", back: "<b>Группа:</b> Противоопухолевые антиметаболиты пиримидиновых оснований.<br><b>Механизм:</b> Фторурацил блокирует тимидилатсинтазу, нарушая синтез ДНК в S-фазу клеточного цикла (применяется при раке желудка, толстой кишки, молочной железы). Цитарабин — при острых лейкозах." },
      { mod: "16", front: "Доксорубицин", back: "<b>Группа:</b> Противоопухолевый антрациклиновый антибиотик.<br><b>Доза:</b> Флаконы 10 и 50 мг (в/в).<br><b>Механизм:</b> Интеркалирует между парами оснований ДНК и блокирует топоизомеразу II. Специфический дозолимитирующий побочный эффект — <b>кардиотоксичность</b> (кардиопротектор — Дексразоксан)." },
      { mod: "16", front: "Винкристин / Паклитаксел / Тамоксифен / Ритуксимаб", back: "<b>Винкристин и Паклитаксел:</b> Митотические яды (действуют на микротрубочки веретена деления).<br><b>Тамоксифен (Т 0,02):</b> Антиэстроген при гормонозависимом раке молочной железы.<br><b>Ритуксимаб (Мабтера):</b> Таргетные моноклональные антитела к рецепторам CD20 В-лимфоцитов (при В-клеточных лимфомах)." }
    ];

    let deck = allCards.filter(c => c.mod === "3");
    let currentIndex = 0;
    let isFlipped = false;

    function renderCard() {
      const cardEl = document.getElementById("card");
      cardEl.classList.toggle("is-flipped", isFlipped);

      if (deck.length === 0) {
        document.getElementById("frontBadge").innerText = "Поиск";
        document.getElementById("frontText").innerText = "Ничего не найдено 🔍";
        document.getElementById("backText").innerHTML = "Попробуйте ввести другое название препарата.";
        document.getElementById("counter").innerText = "0 карточек";
        document.getElementById("progressFill").style.width = "0%";
        return;
      }

      document.getElementById("frontBadge").innerText = `Модуль ${deck[currentIndex].mod} • Препарат / Понятие`;
      document.getElementById("frontText").innerText = deck[currentIndex].front;
      document.getElementById("backText").innerHTML = deck[currentIndex].back;
      document.getElementById("counter").innerText = `Карточка ${currentIndex + 1} из ${deck.length}`;
      
      const percent = ((currentIndex + 1) / deck.length) * 100;
      document.getElementById("progressFill").style.width = `${percent}%`;
    }

    function flipCard() {
      if (deck.length === 0) return;
      isFlipped = !isFlipped;
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      renderCard();
    }

    function nextCard() {
      if (deck.length === 0) return;
      isFlipped = false;
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % deck.length;
        renderCard();
      }, 150);
    }

    function prevCard() {
      if (deck.length === 0) return;
      isFlipped = false;
      setTimeout(() => {
        currentIndex = (currentIndex - 1 + deck.length) % deck.length;
        renderCard();
      }, 150);
    }

    function shuffleCards() {
      if (deck.length === 0) return;
      isFlipped = false;
      deck.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      renderCard();
    }

    function changeModule() {
      document.getElementById("searchInput").value = "";
      const mod = document.getElementById("moduleSelect").value;
      deck = mod === "all" ? [...allCards] : allCards.filter(c => c.mod === mod);
      currentIndex = 0;
      isFlipped = false;
      renderCard();
    }

    function searchCards() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      if (!query) {
        const mod = document.getElementById("moduleSelect").value;
        deck = mod === "all" ? [...allCards] : allCards.filter(c => c.mod === mod);
      } else {
        deck = allCards.filter(c =>
          c.front.toLowerCase().includes(query) ||
          c.back.toLowerCase().includes(query)
        );
      }
      currentIndex = 0;
      isFlipped = false;
      renderCard();
    }

    renderCard();
  </script>
</body>
</html>
